version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      # Linters move together or not at all — a split bump means one PR is red
      # for reasons the other PR caused.
      lint-tooling:
        patterns: ["ruff", "sqlfluff", "pre-commit"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
