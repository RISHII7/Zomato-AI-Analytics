# Install once:  pre-commit install
# Run over everything:  pre-commit run --all-files
#
# These hooks are the local mirror of .github/workflows/ci.yml. Catching a
# 1.3 GB file at commit time is worth far more than catching it at push time,
# because by push time it is already in your history.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # GitHub's hard limit is 100 MB. Stop well short of it — anything this
        # big in a commit is almost always a mistake.
        args: ["--maxkb=51200"]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^data/
      - id: trailing-whitespace
        exclude: ^data/
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        files: ^snowflake/.*\.sql$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
